version: "3.9"

services:
  backend:
    build: ./backend
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - UVICORN_WORKERS=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: oven/bun:latest
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: ["bun", "run", "dev", "--hostname", "0.0.0.0", "--port", "3000"]
    ports:
      - "3000:3000"
    depends_on:
      - backend
